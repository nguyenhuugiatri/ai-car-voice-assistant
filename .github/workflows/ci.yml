name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      # `pnpm build` already runs `tsc -b`, but it is split out so that a red CI
      # tells you whether the failure is in type-checking or in the bundler.
      - run: pnpm typecheck

      - run: pnpm build
